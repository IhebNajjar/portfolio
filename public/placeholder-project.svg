<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0f0f1a"/>
  <!-- subtle grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>
  <!-- corner decorative elements -->
  <rect x="20" y="20" width="40" height="3" fill="rgba(99,102,241,0.4)" rx="2"/>
  <rect x="20" y="20" width="3" height="40" fill="rgba(99,102,241,0.4)" rx="2"/>
  <rect x="740" y="20" width="40" height="3" fill="rgba(99,102,241,0.4)" rx="2"/>
  <rect x="777" y="20" width="3" height="40" fill="rgba(99,102,241,0.4)" rx="2"/>
  <rect x="20" y="477" width="40" height="3" fill="rgba(99,102,241,0.4)" rx="2"/>
  <rect x="20" y="440" width="3" height="40" fill="rgba(99,102,241,0.4)" rx="2"/>
  <rect x="740" y="477" width="40" height="3" fill="rgba(99,102,241,0.4)" rx="2"/>
  <rect x="777" y="440" width="3" height="40" fill="rgba(99,102,241,0.4)" rx="2"/>
  <!-- center text -->
  <text x="400" y="242" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"
        text-anchor="middle" fill="#475569" letter-spacing="2">[ Project Screenshot ]</text>
  <text x="400" y="272" font-family="Inter, Arial, sans-serif" font-size="12"
        text-anchor="middle" fill="#334155" letter-spacing="1">Add your image to public/ folder</text>
</svg>
